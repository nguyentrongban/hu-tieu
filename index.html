<script>
const cv=document.getElementById('cv');let g=cv.getContext('2d');const G0=g;

const hs=i=>{const s=Math.sin(i*127.1+311.7)*43758.5453;return s-Math.floor(s)};

function sign(cx,y,w,h,t,o){o=o||{};TQ.push(()=>{const c=T2,Wp=w*kx(),Hp=h*ky(),X=sx(cx)-Wp/2,Y=sy(y+(o.dy||0)),L=t.split('\n');
 c.save();if(o.dim)c.globalAlpha=.5;
 c.strokeStyle='#6a4a2a';c.lineWidth=Math.max(2,Hp*.07);c.beginPath();c.moveTo(X+Wp*.18,Y+2);c.lineTo(X+Wp*.18,Y-Hp*.35);c.moveTo(X+Wp*.82,Y+2);c.lineTo(X+Wp*.82,Y-Hp*.35);c.stroke();

 c.lineWidth=Math.max(2,Hp*.08);c.strokeStyle=o.bd||'#fff0c8';c.stroke();

 let tx=X+Wp/2,room=Wp*.86;

  c.fillStyle='#f2a83e';c.beginPath();c.ellipse(bx,by,r*.9,r*.28,0,Math.PI,2*Math.PI);c.fill();c.strokeStyle='rgba(255,255,255,.85)';c.lineWidth=r*.14;c.lineCap='round';for(const d of[-.4,.3]){c.beginPath();c.moveTo(bx+d*r,by-r*.4);c.quadraticCurveTo(bx+d*r+r*.3,by-r*.8,bx+d*r,by-r*1.1);c.stroke()}
  tx+=Hp*.4;room-=Hp*1.0}
 let fs=Math.min(Hp*.52/(L.length>1?1.25:1),Hp*.9/L.length);c.font=F(fs);while(fs>6&&Math.max(...L.map(l=>c.measureText(l).width))>room){fs-=1;c.font=F(fs)}
 c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';L.forEach((l,i)=>{const yy=Y+Hp/2+(i-(L.length-1)/2)*fs*1.15;c.lineWidth=fs*.2;c.strokeStyle='rgba(60,20,10,.7)';c.strokeText(l,tx,yy);c.fillStyle='#fff6d0';c.fillText(l,tx,yy)});
 c.restore()})}
function fitOy(){const def=Math.round((H-180)*.4);
 if(matchMedia('(orientation:landscape) and (max-height:520px)').matches)return def;
 const q=document.querySelector('.quest');if(!q)return def;const top=q.getBoundingClientRect().top;if(!(top>0))return def;
 return Math.min(def,Math.max(Math.floor((top-4)/ps)-186,Math.ceil(110/ps)-44))}

addEventListener('resize',size);size();

 for(let i=0;i<h;i+=3)r(x+Math.round(Math.sin(i/9)*2),b-i,2,3,'#7a5a3a');

 r(x+2,y+9,len-4,2,'#a88250');
 for(let k=0;k<9;k++){const i=Math.floor(k*.7);r(x+i,y+k,len-i*2,1,k<2?c2:c1)}

 r(cx-4,by-12,9,12,shirt);r(cx-4,by-12,9,2,'#ffffff40');

function noise(d,v,f){const a=ac();if(!a||!soundOn)return;const n=a.sampleRate*d|0,buf=a.createBuffer(1,n,a.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<n;i++)dd[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),fl=a.createBiquadFilter(),gn=a.createGain();fl.type='bandpass';fl.frequency.value=f;gn.gain.value=v;s.buffer=buf;s.connect(fl);fl.connect(gn);gn.connect(a.destination);s.start()}

$('ov').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||!b.dataset.a)return;ac();const a=b.dataset.a,P=G.plan,cs=CS();
 if(/^[mp][nbt]$/.test(a)){const k=a[1],nv=Math.max(0,P[k]+(a[0]==='p'?4:-4)),tmp={...P,[k]:nv},nc=tmp.n*cs.n+tmp.b*cs.b+tmp.t*cs.t,oc=P.n*cs.n+P.b*cs.b+P.t*cs.t;if(nc<=G.coins||nc<oc)P[k]=nv;sfx('tock');return showPrep()}
 if(/^r\d$/.test(a)){const i=+a[1];if(G.ru[i])G.rec=i;else if(G.coins>=REC[i].u){G.coins-=REC[i].u;G.ru[i]=true;G.rec=i;sfx('coin')}hud();return showPrep()}
 if(a[0]==='d'&&a.length===2){const d=DECOR[+a[1]];if(G.hearts>=d.c){G.hearts-=d.c;G.decor[d.k]=true;sfx('coin');toast(d.n+' đã lên ghe!')}hud();return showPrep()}
 if(a==='loan'){G.coins+=100;G.debt+=100;sfx('coin');hud();return showPrep()}
 if(a==='repay'){const v=Math.min(G.coins,G.debt);G.coins-=v;G.debt-=v;sfx('coin');hud();return showPrep()}
 if(a==='bejo'){G.coins-=120*(G.bejo+1);G.bejo++;sfx('coin');hud();return showPrep()}
 if(a==='cafe'){G.coins-=250;G.cafe=true;sfx('coin');hud();return showPrep()}
 if(a==='boat'){G.coins-=BC[G.boat+1];G.boat++;sfx('coin');hud();toast('Lên '+BOATS[G.boat]+'!');if(G.boat===3&&!G.won){G.won=true;return showWin()}return showPrep()}
 if(a==='go')return startDay(P.n*cs.n+P.b*cs.b+P.t*cs.t);
 if(a==='next'){G.day++;return startPrep()}
 if(a==='cont'||a==='gopen')return showPrep();
 if(a==='again')return newGame()});
$('cook').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!cook)return;ac();
 if(b.dataset.t){const x=b.dataset.t,i=cook.sel.indexOf(x);if(i>=0)cook.sel.splice(i,1);else if(cook.sel.length<G.t)cook.sel.push(x);else toast('Hết topping!');sfx('tock');return renderCook()}
 const k=b.dataset.c;if(k==='0')stepBlanch();else if(k==='1')stepBroth();else if(k==='2')serveBowl()});
$('hold').addEventListener('click',()=>{const w=ev.wake;if(!w||!w.need)return;w.taps++;$('hold').textContent='GIỮ VỮNG BÁT! '+w.taps+'/3';sfx('tock');if(w.taps>=3){w.need=false;$('hold').style.display='none';toast('Giữ vững rồi!')}});
$('act').addEventListener('click',startNext);
$('fev').addEventListener('click',()=>{if(mode!=='day'||!D||!D.fevReady||D.fev>0)return;ac();D.fev=9000;D.fc=9;D.fevAt=D.chain;D.fevReady=false;D.fx=0;shake=2;sfx('fev');toast('THẦN BẾP BÙNG CHÁY!');burst(160,60,28,['#ffe45c','#ff9a2a','#fff']);fevUI()});
clackEl.addEventListener('click',()=>{ac();sfx('tock');if(mode!=='day')return;const ph=performance.now()%600,d=Math.min(ph,600-ph);if(d<150){mprog('clack',1);D.combo++;D.pull=Math.min(10,D.pull+1);hint('Gõ trúng nhịp! x'+D.combo)}else{D.combo=0;hint('Lệch nhịp rồi, gõ theo ánh sáng nhé')}hud()});
$('refill').addEventListener('click',()=>{if(G.coins<4||mode!=='day')return;ac();G.coins-=4;G.b=Math.min(30,G.b+2);sfx('bub');hud()});
$('awn').addEventListener('click',()=>{ac();awn=!awn;sfx('tock');hud()});
$('mute').addEventListener('click',()=>{soundOn=!soundOn;$('mute').textContent='ÂM: '+(soundOn?'BẬT':'TẮT');if(soundOn)ac()});
cv.addEventListener('pointerdown',e=>{ac();if(mode!=='day'||cook)return;const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W-ox,y=(e.clientY-b.top)/b.height*H-oy;
 const s=slots.find(s=>s.on&&s.st==='wait'&&x>s.x+s.off-8&&x<s.x+s.off+s.len+8&&y>s.y-70&&y<s.y+12);if(s)openCook(s)});
function icon(id,fn){const x=$(id).getContext('2d');g=x;fn();g=G0}
function icons(){icon('icoC',()=>{disc(16,16,14,'#c8912a');disc(16,16,13,'#ffc94d');disc(16,16,11,'#ffe27a');disc(16,16,8,'#ffc94d');disc(16,16,7,'#fff0a8');r(15,10,3,12,'#c8912a');r(12,14,9,2,'#c8912a');r(6,7,2,5,'#fff')})}
function start(){if(window.ResizeObserver)new ResizeObserver(()=>{oyT=fitOy()}).observe(document.querySelector('.quest'));makeIcons();icons();try{const o=JSON.parse(localStorage.getItem('chonoi2'));G=o&&o.day?{...DEF(),...o}:DEF()}catch(e){G=DEF()}
 const gf=daily();startPrep();if(gf)showGift(gf);requestAnimationFrame(frame)}
function daily(){const td=new Date().toISOString().slice(0,10);let o=null;const off=G.seen&&G.day>1?Math.round(Math.min(8,(Date.now()-G.seen)/36e5)*(6+G.boat*10)*(.6+G.rep/5)):0;
 if(G.last!==td){const y=new Date(Date.now()-864e5).toISOString().slice(0,10),br=!!G.last&&G.last!==y;G.streak=G.last===y?(G.streak||0)+1:1;const gift=Math.min(300,40+G.streak*25),hp=G.streak%3===0?3:1;G.coins+=gift;G.hearts+=hp;G.last=td;G.dm=newMissions(td);o={streak:G.streak,gift,hp,broken:br,off}}
 else if(off>=8)o={streak:G.streak,gift:0,hp:0,off};
 if(off>0)G.coins+=off;if(!G.dm||G.dm.d!==td)G.dm=newMissions(td);return o}
function showGift(o){$('ov').innerHTML=`<div class="sheet"><h2>Chào ngày mới, chủ ghe!</h2><p>Chuỗi ${o.streak} ngày liên tiếp${o.broken?' (chuỗi cũ bị đứt, bắt đầu lại nhé)':''}</p>${o.gift?`<div class="qt">Quà điểm danh: +${o.gift} xu, +${o.hp} ♥</div>`:''}${o.off?`<div class="qt">Ghe tự bán khi bạn vắng: +${o.off} xu</div>`:''}<p class="mut">Mai quay lại nhận quà lớn hơn: +${Math.min(300,40+(o.streak+1)*25)} xu. Khách quen đang nhớ bạn đó!</p><button class="go" data-a="gopen">Nhận quà</button></div>`;$('ov').style.display='flex'}
try{document.fonts.load('800 16px "Baloo 2"').then(start,start)}catch(e){start()}
</script></body></html>
